name: engineering-checks
on: [push, pull_request]
concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RUN_REAL_AGENT: "0"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RW_QA_SURFACES: "1"
      BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:architecture
      - run: pnpm lint:code
      - run: pnpm lint:styles
      - run: pnpm format:check --ci
      - run: pnpm test
      - run: pnpm build:app
      - run: pnpm build:licenses
      - run: pnpm setup:electron
      - if: runner.os != 'Linux'
        run: pnpm test:ui
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-${{ matrix.os }}
          path: .tmp/ui/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
